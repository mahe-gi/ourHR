<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="340" height="90" fill="none">
  <defs>
    <linearGradient id="darkVetanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="darkVetanEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="darkVetanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.3" />
    </linearGradient>
    <filter id="darkVetanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- V Emblem on Left -->
  <g transform="translate(8, 9)">
    <rect width="72" height="72" rx="18" fill="#1E293B" />
    <rect width="72" height="72" rx="18" stroke="url(#darkVetanBorder)" stroke-width="1.2" />
    <path d="M 22 22 L 36 50" stroke="url(#darkVetanIndigo)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 36 50 L 50 22" stroke="url(#darkVetanEmerald)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 27 34 H 45" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <circle cx="36" cy="34" r="3" fill="#34D399" filter="url(#darkVetanGlow)" />
  </g>

  <!-- Wordmark 'Vetan' -->
  <g transform="translate(94, 52)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="40" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">Vetan</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(96, 68)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="2.6">HR &amp; STATUTORY PAYROLL</text>
  </g>

  <!-- Statutory Badge Pill -->
  <g transform="translate(236, 28)">
    <rect width="90" height="20" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#059669" stroke-width="1" />
    <circle cx="246" cy="38" r="3" fill="#34D399" />
    <text x="254" y="42" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#34D399" letter-spacing="0.5">INDIA MSME</text>
  </g>
</svg>
