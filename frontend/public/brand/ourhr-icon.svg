<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="statutoryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0F172A" />
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- The Geometric 'our' Orbital Loop -->
  <circle cx="60" cy="60" r="38" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-dasharray="160 80" stroke-linecap="round" transform="rotate(-45 60 60)" />

  <!-- The Interlocking 'H' Architecture: Left Pillar, Right Pillar, Central Bridge -->
  <path d="M 44 40 V 80" stroke="#F8FAFC" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 76 40 V 80" stroke="#F8FAFC" stroke-width="6.5" stroke-linecap="round" />
  
  <!-- Dynamic Compliance Bridge (The 'R' Loop & Crossbar) -->
  <path d="M 44 60 H 76" stroke="url(#statutoryGrad)" stroke-width="6.5" stroke-linecap="round" />
  
  <!-- Modern Loop of 'R' arching over right upper quadrant -->
  <path d="M 60 40 C 72 40 76 48 76 58" stroke="url(#statutoryGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Precision Compliance Equilibrium Node -->
  <circle cx="60" cy="60" r="4" fill="#10B981" filter="url(#subtleGlow)" />
</svg>
